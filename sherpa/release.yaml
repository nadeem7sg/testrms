workload:
  name: testrms
  type: service
  runtime: container
  deployment: argo-rollouts
source:
  provider: github
  repository: nadeem7sg/testrms
  default_branch: main
release:
  artifact_type: container
  image_name: testrms
  immutable_promotion: true
rollback:
  strategy: previous_digest
  required: true
observability:
  health_path: /health
  readiness_path: /ready
  version_path: /version
  metrics_path: /metrics
